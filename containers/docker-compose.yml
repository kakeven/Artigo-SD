services:

  pedidos:
    build: ./pedidos
    container_name: monitor-pedidos
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ESTOQUE_URL: http://estoque:8000
      INVENTORY_URL: http://estoque:8000
      PAGAMENTOS_URL: http://pagamentos:8000
      AGENT_CONTROL_TOKEN: ${AGENT_CONTROL_TOKEN:?Execute python preparar_ambiente.py}
    labels:
      monitor: "true"
      tipo: "pedidos"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 2

  estoque:
    build: ./estoque
    container_name: monitor-estoque
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      AGENT_CONTROL_TOKEN: ${AGENT_CONTROL_TOKEN:?Execute python preparar_ambiente.py}
    labels:
      monitor: "true"
      tipo: "estoque"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 2

  pagamentos:
    build: ./pagamentos
    container_name: monitor-pagamentos
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      AGENT_CONTROL_TOKEN: ${AGENT_CONTROL_TOKEN:?Execute python preparar_ambiente.py}
    labels:
      monitor: "true"
      tipo: "pagamentos"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 2

  protecao:
    build: ./protecao
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      ESTOQUE_URL: http://estoque:8000
      PEDIDOS_URL: http://pedidos:8000
      PAGAMENTOS_URL: http://pagamentos:8000
      AGENT_URL: http://agente:8000
      AGENT_CONTROL_TOKEN: ${AGENT_CONTROL_TOKEN:?Execute python preparar_ambiente.py}
      MAX_ATTEMPTS: "2"
      FAILURE_THRESHOLD: "5"
      COOLDOWN_SECONDS: "5"
    depends_on:
      - estoque
      - pedidos
      - pagamentos

  agente:
    build: ./agente
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      PEDIDOS_URL: http://pedidos:8000
      ESTOQUE_URL: http://estoque:8000
      PAGAMENTOS_URL: http://pagamentos:8000
      GATEWAY_URL: http://protecao:8000
      LOG_DB_PATH: /data/observabilidade.db
      AGENT_CONTROL_TOKEN: ${AGENT_CONTROL_TOKEN:?Execute python preparar_ambiente.py}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct-q4_K_M}
    volumes:
      - agent_data:/data
      - ./pagamentos:/source/pagamentos:ro
      - ./estoque:/source/estoque:ro
    depends_on:
      - pedidos
      - estoque
      - pagamentos
      - protecao

volumes:
  agent_data:
